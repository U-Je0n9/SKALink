openapi: 3.0.3
info:
  title: SKALog — UI 기준 간소화 API
  version: 2.0.0
  description: >-
    현재 화면의 조회·버튼 동작만 정의합니다. 이메일 인증, 명단 대조 자동 승인, 감사 기록, 낙관적 잠금, 화면에 없는 수정·숨김 기능을 제외했습니다. 회원가입은 관리자 승인 방식입니다. 서버 로그인 세션을
    사용하되 별도 세션 테이블과 Security Scheme은 이번 과제 모델에서 제외합니다. 사용자·과목·자료 접근 권한은 각 요청에서 검증합니다. 브라우저 데모는 localStorage 목 서비스,
    Swagger Try it out은 Prism의 무상태 목 응답입니다.
servers:
  - url: /api
    description: Prism OAS 목 서버
tags:
  - name: Auth
  - name: Home
  - name: Courses
  - name: Questions
  - name: Posts
  - name: Admin
paths:
  /auth/register:
    post:
      tags:
        - Auth
      summary: 회원가입 신청
      operationId: post_auth_register
      description: 이메일 인증 없이 정보를 입력하면 PENDING으로 생성합니다.
      responses:
        '201': {description: 성공, content: {application/json: {schema: {$ref: '#/components/schemas/User'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '409': {$ref: '#/components/responses/Conflict'}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/Register'}}}
  /auth/login:
    post:
      tags:
        - Auth
      summary: 이메일 로그인
      operationId: post_auth_login
      description: ACTIVE 계정만 로그인합니다. 서버가 로그인 세션을 설정합니다.
      responses:
        '200': {description: 성공, content: {application/json: {schema: {$ref: '#/components/schemas/User'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/Login'}}}
  /auth/logout:
    post:
      tags:
        - Auth
      summary: 로그아웃
      operationId: post_auth_logout
      description: 현재 로그인 세션을 종료합니다.
      responses:
        '204': {description: 처리 완료}
  /me:
    get:
      tags:
        - Auth
      summary: 현재 사용자
      operationId: get_me
      responses:
        '200': {description: 성공, content: {application/json: {schema: {$ref: '#/components/schemas/User'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /dashboard:
    get:
      tags:
        - Home
      summary: 답변 활동 집계
      operationId: get_dashboard
      responses:
        '200': {description: 성공, content: {application/json: {schema: {$ref: '#/components/schemas/Dashboard'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /courses:
    get:
      tags:
        - Courses
      summary: 과목 목록
      operationId: get_courses
      description: '학생은 자기 층 일정이 있는 과목, 교수님은 담당 과목 우선, 관리자는 전체 과목을 조회합니다.'
      parameters:
        - {name: q, in: query, required: false, schema: {type: string}, description: 과목명 또는 교수님 이름}
        - {name: phase, in: query, required: false, schema: {type: string, enum: [UPCOMING, IN_PROGRESS, ENDED]}}
      responses:
        '200': {description: 성공, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/Course'}}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  '/courses/{courseId}':
    parameters:
      - name: courseId
        in: path
        required: true
        schema: {type: integer, format: int64, minimum: 1}
    get:
      tags:
        - Courses
      summary: 과목 상세·일정·교수님 배정
      operationId: get_courses__courseId_
      responses:
        '200': {description: 성공, content: {application/json: {schema: {$ref: '#/components/schemas/Course'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /questions:
    get:
      tags:
        - Questions
      summary: 질문 목록·미답변 목록
      operationId: get_questions
      description: 'courseId가 있으면 해당 과목, 없으면 전체 과목을 조회합니다. scope=MINE은 교수님 담당 과목입니다.'
      parameters:
        - {name: courseId, in: query, required: false, schema: {type: integer, format: int64, minimum: 1}}
        - {name: status, in: query, required: false, schema: {$ref: '#/components/schemas/QuestionStatus'}}
        - {name: scope, in: query, required: false, schema: {type: string, enum: [ALL, MINE]}}
        - {name: q, in: query, required: false, schema: {type: string}, description: 제목·본문 검색}
      responses:
        '200': {description: 성공, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/Question'}}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  '/courses/{courseId}/questions':
    parameters:
      - name: courseId
        in: path
        required: true
        schema: {type: integer, format: int64, minimum: 1}
    post:
      tags:
        - Questions
      summary: 질문 등록
      operationId: post_courses__courseId__questions
      description: 교육생 또는 해당 과목 배정 교수님이 작성합니다. 태그는 데모에서 새 질문을 기본으로 표시합니다.
      responses:
        '201': {description: 성공, content: {application/json: {schema: {$ref: '#/components/schemas/Question'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/QuestionWrite'}}}
  '/courses/{courseId}/similar-questions':
    parameters:
      - name: courseId
        in: path
        required: true
        schema: {type: integer, format: int64, minimum: 1}
    post:
      tags:
        - Questions
      summary: 유사 질문 확인
      operationId: post_courses__courseId__similar_questions
      description: 제목의 단어로 같은 과목에서 최대 3개를 찾는 데모입니다.
      responses:
        '200': {description: 성공, content: {application/json: {schema: {type: array, items: {type: object, required: [id, title, answerCount], properties: {id: {type: integer, format: int64, minimum: 1}, title: {type: string}, answerCount: {type: integer, minimum: 0}}}}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, required: [title], properties: {title: {type: string, minLength: 1, maxLength: 150}}}}}
  '/questions/{questionId}':
    parameters:
      - name: questionId
        in: path
        required: true
        schema: {type: integer, format: int64, minimum: 1}
    get:
      tags:
        - Questions
      summary: 질문과 답변 상세
      operationId: get_questions__questionId_
      description: 답변 목록을 한 번에 반환합니다.
      responses:
        '200': {description: 성공, content: {application/json: {schema: {$ref: '#/components/schemas/QuestionDetail'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    patch:
      tags:
        - Questions
      summary: 질문 해결·다시 열기
      operationId: patch_questions__questionId_
      description: 질문 작성자만 OPEN/RESOLVED 상태를 변경합니다.
      responses:
        '200': {description: 성공, content: {application/json: {schema: {$ref: '#/components/schemas/Question'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, required: [status], properties: {status: {$ref: '#/components/schemas/QuestionStatus'}}}}}
  '/questions/{questionId}/answers':
    parameters:
      - name: questionId
        in: path
        required: true
        schema: {type: integer, format: int64, minimum: 1}
    post:
      tags:
        - Questions
      summary: 답변 등록
      operationId: post_questions__questionId__answers
      description: 활성 교육생·교수님이 답변합니다. 교수님의 담당 여부는 제한하지 않습니다.
      responses:
        '201': {description: 성공, content: {application/json: {schema: {$ref: '#/components/schemas/Answer'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, required: [body], properties: {body: {type: string, minLength: 1, maxLength: 10000}}}}}
  '/courses/{courseId}/posts':
    parameters:
      - name: courseId
        in: path
        required: true
        schema: {type: integer, format: int64, minimum: 1}
    get:
      tags:
        - Posts
      summary: 보충 설명·학습자료 목록
      operationId: get_courses__courseId__posts
      description: 학생 공개 범위를 적용하고 전임 글을 우선 정렬합니다. 최근 자료 변경은 latestVersion과 userState로 표시합니다.
      parameters:
        - {name: type, in: query, required: false, schema: {$ref: '#/components/schemas/PostType'}}
      responses:
        '200': {description: 성공, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/Post'}}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    post:
      tags:
        - Posts
      summary: 보충 설명·학습자료 게시
      operationId: post_courses__courseId__posts
      description: 배정된 활성 교수님만 게시합니다. MATERIAL은 최초 버전과 파일을 함께 생성합니다.
      responses:
        '201': {description: 성공, content: {application/json: {schema: {$ref: '#/components/schemas/PostDetail'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
      requestBody:
        required: true
        content: {multipart/form-data: {schema: {$ref: '#/components/schemas/PostWrite'}}}
  '/posts/{postId}':
    parameters:
      - name: postId
        in: path
        required: true
        schema: {type: integer, format: int64, minimum: 1}
    get:
      tags:
        - Posts
      summary: 게시물과 전체 버전 상세
      operationId: get_posts__postId_
      description: 현재 사용자의 공개 범위를 검증합니다.
      responses:
        '200': {description: 성공, content: {application/json: {schema: {$ref: '#/components/schemas/PostDetail'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  '/posts/{postId}/versions':
    parameters:
      - name: postId
        in: path
        required: true
        schema: {type: integer, format: int64, minimum: 1}
    post:
      tags:
        - Posts
      summary: 새 자료 버전 게시
      operationId: post_posts__postId__versions
      description: 원 게시자인 활성 교수님만 등록합니다. 버전 번호는 서버가 순서대로 부여하며 기존 파일을 보존합니다.
      responses:
        '201': {description: 성공, content: {application/json: {schema: {$ref: '#/components/schemas/Version'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
      requestBody:
        required: true
        content: {multipart/form-data: {schema: {$ref: '#/components/schemas/VersionWrite'}}}
  '/material-versions/{versionId}/download':
    parameters:
      - name: versionId
        in: path
        required: true
        schema: {type: integer, format: int64, minimum: 1}
    get:
      tags:
        - Posts
      summary: 버전 파일 모두 다운로드
      operationId: get_material_versions__versionId__download
      description: '게시물 공개 범위를 검증합니다. 파일 하나는 원본, 여러 파일은 ZIP으로 반환합니다.'
      responses:
        '200': {description: 파일 또는 ZIP, content: {application/octet-stream: {schema: {type: string, format: binary}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /post-updates:
    get:
      tags:
        - Home
      summary: 새로 올라온 자료
      operationId: get_post_updates
      description: 현재 사용자에게 공개되고 isDismissed=false인 설명·자료를 최신순 최대 4개 반환합니다.
      responses:
        '200': {description: 성공, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/Post'}}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  '/posts/{postId}/user-state':
    parameters:
      - name: postId
        in: path
        required: true
        schema: {type: integer, format: int64, minimum: 1}
    patch:
      tags:
        - Posts
      summary: 알림 읽음·숨김·버전 확인
      operationId: patch_posts__postId__user_state
      description: 로그인 사용자의 해당 게시물 상태만 변경합니다. 공개 범위를 검증하며 userId를 입력받지 않습니다.
      responses:
        '200': {description: 성공, content: {application/json: {schema: {$ref: '#/components/schemas/UserState'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/UserStateWrite'}}}
  /admin/users:
    get:
      tags:
        - Admin
      summary: 회원·가입 요청·교수님 목록
      operationId: get_admin_users
      description: 관리자 전용입니다.
      parameters:
        - {name: role, in: query, required: false, schema: {$ref: '#/components/schemas/Role'}}
        - {name: status, in: query, required: false, schema: {$ref: '#/components/schemas/UserStatus'}}
        - {name: classNumber, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 10}}
      responses:
        '200': {description: 성공, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/User'}}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  '/admin/users/{userId}':
    parameters:
      - name: userId
        in: path
        required: true
        schema: {type: integer, format: int64, minimum: 1}
    patch:
      tags:
        - Admin
      summary: 가입 승인·반려·활성 전환
      operationId: patch_admin_users__userId_
      description: 관리자 전용입니다. 이름·반 변경과 감사 기록은 범위에 포함하지 않습니다.
      responses:
        '200': {description: 성공, content: {application/json: {schema: {$ref: '#/components/schemas/User'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/UserStatusWrite'}}}
  /admin/courses:
    post:
      tags:
        - Admin
      summary: 과목·일정·교수님 배정 등록
      operationId: post_admin_courses
      description: 관리자 전용입니다. 하나의 저장 버튼으로 일정과 배정을 함께 저장합니다.
      responses:
        '201': {description: 성공, content: {application/json: {schema: {$ref: '#/components/schemas/Course'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/CourseWrite'}}}
  '/admin/courses/{courseId}':
    parameters:
      - name: courseId
        in: path
        required: true
        schema: {type: integer, format: int64, minimum: 1}
    patch:
      tags:
        - Admin
      summary: 과목·일정·교수님 배정 수정
      operationId: patch_admin_courses__courseId_
      description: 관리자 전용입니다. 전체 폼을 검증한 뒤 함께 반영합니다.
      responses:
        '200': {description: 성공, content: {application/json: {schema: {$ref: '#/components/schemas/Course'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/CourseWrite'}}}
components:
  schemas:
    Role:
      type: string
      enum:
        - STUDENT
        - PROFESSOR
        - ADMIN
    UserStatus:
      type: string
      enum:
        - PENDING
        - ACTIVE
        - REJECTED
        - INACTIVE
    InstructorKind:
      type: string
      enum:
        - LEAD
        - PRACTICE
    QuestionStatus:
      type: string
      enum:
        - OPEN
        - RESOLVED
    PostType:
      type: string
      enum:
        - EXPLANATION
        - MATERIAL
    Error:
      type: object
      required:
        - message
      properties:
        message: {type: string, description: 화면에 표시할 오류 메시지, example: 입력값을 확인해주세요.}
    Author:
      type: object
      required:
        - id
        - name
        - role
        - classNumber
      properties:
        id: {type: integer, format: int64, minimum: 1}
        name: {type: string, example: 김하늘}
        role: {$ref: '#/components/schemas/Role'}
        classNumber: {type: integer, minimum: 1, maximum: 10, nullable: true}
    User:
      type: object
      required:
        - id
        - email
        - name
        - role
        - status
        - classNumber
        - pCode
        - employeeNo
      properties:
        id: {type: integer, format: int64, minimum: 1}
        email: {type: string, format: email, example: haneul@skala.example}
        name: {type: string, example: 김하늘}
        role: {$ref: '#/components/schemas/Role'}
        status: {$ref: '#/components/schemas/UserStatus'}
        classNumber: {type: integer, minimum: 1, maximum: 10, nullable: true}
        pCode: {type: string, pattern: '^P[0-9]{3}$', nullable: true}
        employeeNo: {type: string, pattern: '^T[0-9]{4}$', nullable: true}
    Login:
      type: object
      required:
        - email
        - password
      properties:
        email: {type: string, format: email, example: haneul@skala.example}
        password: {type: string, format: password, writeOnly: true, minLength: 8, maxLength: 128, example: skala1234}
    Register:
      type: object
      required:
        - role
        - email
        - password
        - name
      properties:
        role: {type: string, enum: [STUDENT, PROFESSOR]}
        email: {type: string, format: email, example: haneul@skala.example}
        password: {type: string, format: password, writeOnly: true, minLength: 8, maxLength: 128, example: skala1234}
        name: {type: string, minLength: 1, maxLength: 100}
        pCode: {type: string, description: STUDENT일 때 필수, pattern: '^P[0-9]{3}$'}
        employeeNo: {type: string, description: PROFESSOR일 때 필수, pattern: '^T[0-9]{4}$'}
        classNumber: {type: integer, description: STUDENT일 때 필수, minimum: 1, maximum: 10}
      description: '교육생은 pCode·classNumber, 교수님은 employeeNo가 필수입니다. 가입 상태는 항상 PENDING이며 관리자가 승인합니다. 역할에 맞지 않는 식별번호는 저장하지 않습니다.'
    Session:
      type: object
      required:
        - floor
        - startDate
        - endDate
      properties:
        floor: {type: integer, enum: [4, 5]}
        startDate: {type: string, format: date}
        endDate: {type: string, format: date}
    Assignment:
      type: object
      required:
        - professorId
        - classNumber
        - instructorKind
      properties:
        professorId: {type: integer, format: int64, minimum: 1}
        classNumber: {type: integer, minimum: 1, maximum: 10}
        instructorKind: {$ref: '#/components/schemas/InstructorKind'}
    Course:
      type: object
      required:
        - id
        - code
        - title
        - description
        - colorKey
        - sessions
        - assignments
      properties:
        id: {type: integer, format: int64, minimum: 1}
        code: {type: string, example: WEB-401}
        title: {type: string, example: 웹 서비스 개발 Mini-Project}
        description: {type: string, nullable: true}
        colorKey: {type: string, enum: [green, orange, blue, violet]}
        sessions: {type: array, items: {$ref: '#/components/schemas/Session'}}
        assignments: {type: array, items: {type: object, required: [professorId, classNumber, instructorKind, professorName], properties: {professorId: {type: integer, format: int64, minimum: 1}, classNumber: {type: integer, minimum: 1, maximum: 10}, instructorKind: {$ref: '#/components/schemas/InstructorKind'}, professorName: {type: string}}}}
      description: >-
        층은 반 번호, 예정/진행/종료와 표시 기간은 sessions와 현재 날짜, 내 담당 여부·게시 권한·교수님 이름 목록은 assignments에서 계산합니다. 관리자에게는 전체 배정, 학생에게는 자기
        층 전임과 자기 반 배정을 반환합니다.
    CourseWrite:
      type: object
      required:
        - title
        - sessions
        - assignments
      properties:
        title: {type: string, minLength: 1, maxLength: 150}
        sessions: {type: array, items: {$ref: '#/components/schemas/Session'}, minItems: 2, maxItems: 2}
        assignments: {type: array, items: {$ref: '#/components/schemas/Assignment'}, minItems: 10, maxItems: 10}
      description: >-
        관리자 폼의 과목명·두 층 일정·10개 반 배정을 한 번에 저장합니다. 각 층 일정 1개, 시작일<=종료일, 서로 다른 활성 교수님 10명, 층별 LEAD 1명/PRACTICE 4명을 검증 후 하나의
        트랜잭션으로 저장합니다. code는 생성, 신규 description은 빈 문자열, colorKey는 기본값이며 수정 시 기존 값을 유지합니다.
    Question:
      type: object
      required:
        - id
        - courseId
        - courseTitle
        - author
        - title
        - body
        - status
        - tags
        - createdAt
        - answerCount
      properties:
        id: {type: integer, format: int64, minimum: 1}
        courseId: {type: integer, format: int64, minimum: 1}
        courseTitle: {type: string}
        author: {$ref: '#/components/schemas/Author'}
        title: {type: string}
        body: {type: string}
        status: {$ref: '#/components/schemas/QuestionStatus'}
        tags: {type: array, items: {type: string}}
        createdAt: {type: string, format: date-time}
        answerCount: {type: integer, minimum: 0}
    Answer:
      type: object
      required:
        - id
        - questionId
        - author
        - body
        - createdAt
      properties:
        id: {type: integer, format: int64, minimum: 1}
        questionId: {type: integer, format: int64, minimum: 1}
        author: {$ref: '#/components/schemas/Author'}
        body: {type: string}
        createdAt: {type: string, format: date-time}
      description: '교수님 배지는 author.role로 표시합니다. 교수님 답변 우선, 그룹 안에서는 작성일 오름차순입니다.'
    QuestionDetail:
      allOf:
        - {$ref: '#/components/schemas/Question'}
        - {type: object, required: [answers], properties: {answers: {type: array, items: {$ref: '#/components/schemas/Answer'}}}}
    QuestionWrite:
      type: object
      required:
        - title
        - body
      properties:
        title: {type: string, minLength: 1, maxLength: 150}
        body: {type: string, minLength: 1, maxLength: 20000}
    Visibility:
      type: object
      required:
        - scope
        - target
      properties:
        scope: {type: string, enum: [ALL, FLOOR, CLASS]}
        target: {type: integer, nullable: true}
      description: 'ALL: target=null, FLOOR: target=4/5, CLASS: target=1~10. 게시자는 자신의 배정 범위 안에서만 지정합니다.'
    File:
      type: object
      required:
        - id
        - fileName
        - fileSizeBytes
      properties:
        id: {type: integer, format: int64, minimum: 1}
        fileName: {type: string}
        fileSizeBytes: {type: integer, format: int64, minimum: 0}
      description: '파일 종류는 파일명의 확장자, 버전 총 크기는 fileSizeBytes 합계로 표시합니다. 내부 file_url은 응답에 노출하지 않습니다.'
    Version:
      type: object
      required:
        - id
        - versionNumber
        - changeNote
        - files
      properties:
        id: {type: integer, format: int64, minimum: 1}
        versionNumber: {type: integer, minimum: 1}
        changeNote: {type: string}
        files: {type: array, items: {$ref: '#/components/schemas/File'}, minItems: 1}
    UserState:
      type: object
      required:
        - postId
        - lastSeenVersionId
        - isRead
        - isDismissed
        - hasUnseenVersion
      properties:
        postId: {type: integer, format: int64, minimum: 1}
        lastSeenVersionId: {type: integer, format: int64, minimum: 1, nullable: true}
        isRead: {type: boolean}
        isDismissed: {type: boolean}
        hasUnseenVersion: {type: boolean}
      description: hasUnseenVersion은 마지막 확인 버전과 최신 버전 비교 결과입니다. 설명 게시물은 false입니다. 각 상태는 별도 UI 동작이며 서로 영향을 주지 않습니다.
    Post:
      type: object
      required:
        - id
        - courseId
        - courseTitle
        - author
        - instructorKind
        - type
        - visibility
        - title
        - body
        - updatedAt
        - latestVersion
        - userState
      properties:
        id: {type: integer, format: int64, minimum: 1}
        courseId: {type: integer, format: int64, minimum: 1}
        courseTitle: {type: string}
        author: {$ref: '#/components/schemas/Author'}
        instructorKind: {$ref: '#/components/schemas/InstructorKind'}
        type: {$ref: '#/components/schemas/PostType'}
        visibility: {$ref: '#/components/schemas/Visibility'}
        title: {type: string}
        body: {type: string}
        updatedAt: {type: string, format: date-time}
        latestVersion: {nullable: true, allOf: [{$ref: '#/components/schemas/Version'}]}
        userState: {$ref: '#/components/schemas/UserState'}
    PostDetail:
      description: 'MATERIAL은 최신순으로 모든 버전을 함께 반환합니다. EXPLANATION은 versions=[]와 latestVersion=null입니다. 별도 버전 목록 API를 호출하지 않습니다.'
      allOf:
        - {$ref: '#/components/schemas/Post'}
        - {type: object, required: [versions], properties: {versions: {type: array, items: {$ref: '#/components/schemas/Version'}}}}
    PostWrite:
      type: object
      required:
        - type
        - title
        - body
        - visibilityScope
      properties:
        type: {$ref: '#/components/schemas/PostType'}
        title: {type: string, minLength: 1, maxLength: 150}
        body: {type: string, minLength: 1, maxLength: 20000}
        visibilityScope: {type: string, enum: [ALL, FLOOR, CLASS]}
        visibilityTarget: {type: integer, description: 'FLOOR는 4/5, CLASS는 1~10, ALL은 생략 또는 null', nullable: true}
        files: {type: array, items: {type: string, format: binary}, minItems: 1, description: MATERIAL일 때 필수. EXPLANATION에서는 생략.}
    VersionWrite:
      type: object
      required:
        - files
        - changeNote
      properties:
        files: {type: array, items: {type: string, format: binary}, minItems: 1}
        changeNote: {type: string, minLength: 1, maxLength: 2000}
    UserStateWrite:
      type: object
      properties:
        isRead: {type: boolean}
        isDismissed: {type: boolean}
        lastSeenVersionId: {type: integer, format: int64, minimum: 1}
      minProperties: 1
      additionalProperties: false
      description: 전달한 항목만 변경합니다. 읽음/숨김은 알림 UI용입니다. 확인 버전은 같은 게시물의 버전이어야 하며 이전 버전으로 역행하지 않습니다.
    UserStatusWrite:
      type: object
      required:
        - status
      properties:
        status: {$ref: '#/components/schemas/UserStatus'}
      description: 'PENDING → ACTIVE/REJECTED, ACTIVE ↔ INACTIVE. 마지막 활성 관리자는 비활성화할 수 없습니다.'
    Dashboard:
      type: object
      required:
        - totalAnswerCount
        - weeklyAnswerCounts
      properties:
        totalAnswerCount: {type: integer, minimum: 0}
        weeklyAnswerCounts: {type: array, items: {type: object, required: [date, answerCount], properties: {date: {type: string, format: date}, answerCount: {type: integer, minimum: 0}}}}
      description: 답변 테이블을 집계하며 별도 통계 테이블을 저장하지 않습니다. weeklyAnswerCounts는 최근 7일을 날짜 오름차순으로 반환합니다.
  responses:
    BadRequest:
      description: 입력값 오류
      content:
        application/json: {schema: {$ref: '#/components/schemas/Error'}}
    Unauthorized:
      description: 로그인 필요 또는 로그인 정보 오류
      content:
        application/json: {schema: {$ref: '#/components/schemas/Error'}}
    Forbidden:
      description: 접근 권한 없음 또는 승인 대기·반려·비활성 계정
      content:
        application/json: {schema: {$ref: '#/components/schemas/Error'}}
    NotFound:
      description: 대상 없음
      content:
        application/json: {schema: {$ref: '#/components/schemas/Error'}}
    Conflict:
      description: 중복 데이터
      content:
        application/json: {schema: {$ref: '#/components/schemas/Error'}}
