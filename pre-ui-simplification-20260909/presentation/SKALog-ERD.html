<script id="dbml" type="text/plain">// SKALog 학습 지식 공유 플랫폼 데이터 모델
// API v1.1.0 기준. floor는 1~5반=4층, 6~10반=5층 규칙을 적용한다.

Enum user_role {
  STUDENT
  PROFESSOR
  ADMIN
}

Enum user_status {
  PENDING
  ACTIVE
  REJECTED
  INACTIVE
}

Enum instructor_kind {
  LEAD
  PRACTICE
}

Enum question_status {
  OPEN
  RESOLVED
}

Enum post_type {
  EXPLANATION
  MATERIAL
}

Enum visibility_scope {
  ALL
  FLOOR
  CLASS
}

Table users {
  id bigint [pk, increment]
  email varchar(254) [not null, unique, note: '로그인 ID. 비교 시 소문자 정규화']
  password_hash varchar(255) [not null, note: '원문 비밀번호 저장 금지']
  name varchar(100) [not null]
  role user_role [not null]
  status user_status [not null, default: 'PENDING']
  p_code varchar(4) [unique, note: '교육생만 사용, P+숫자 3자리']
  employee_no varchar(5) [unique, note: '교수님만 사용, T+숫자 4자리']
  class_number int [note: '교육생만 1~10. floor 응답은 이 값으로 계산']
  email_verified_at timestamp
  approved_by bigint
  approved_at timestamp
  rejected_reason varchar(500)
  deactivated_at timestamp
  last_login_at timestamp
  revision int [not null, default: 1, note: '관리자 수정 낙관적 잠금']
  created_at timestamp [not null, default: `now()`]
  updated_at timestamp [not null, default: `now()`]

  Note: '역할별 CHECK: STUDENT는 p_code/class_number 필수, PROFESSOR는 employee_no 필수, ADMIN은 둘 다 null. ACTIVE 전환 시 email_verified_at 필수.'
}

Table registration_directory {
  identity_no varchar(5) [pk, note: '교육생 P코드 또는 교수님 사번']
  role user_role [not null, note: 'STUDENT 또는 PROFESSOR만 허용']
  name varchar(100) [not null]
  email varchar(254) [not null, unique]
  class_number int [note: '교육생만 1~10']
  is_current boolean [not null, default: true]
  created_at timestamp [not null, default: `now()`]
  updated_at timestamp [not null, default: `now()`]

  Note: '회원가입 자동 승인을 위한 내부 기준 명단. 관리자 화면의 학생 목록과는 별개이며 직접 노출하지 않는다.'
}

Table email_verifications {
  id bigint [pk, increment]
  email varchar(254) [not null]
  code_hash varchar(255) [not null]
  attempt_count int [not null, default: 0]
  sent_at timestamp [not null, default: `now()`]
  expires_at timestamp [not null]
  verified_at timestamp
  verification_token_hash varchar(255) [unique]
  token_expires_at timestamp
  consumed_at timestamp
  created_at timestamp [not null, default: `now()`]

  indexes {
    (email, created_at) [name: 'idx_email_verifications_email_created']
  }
}

Table auth_sessions {
  id uuid [pk]
  user_id bigint [not null]
  token_hash varchar(255) [not null, unique, note: 'HttpOnly 세션 쿠키의 해시']
  expires_at timestamp [not null]
  revoked_at timestamp
  last_seen_at timestamp [not null, default: `now()`]
  ip_hash varchar(255)
  user_agent varchar(500)
  created_at timestamp [not null, default: `now()`]

  indexes {
    (user_id, revoked_at, expires_at) [name: 'idx_auth_sessions_user_active']
  }
}

Table courses {
  id bigint [pk, increment]
  internal_code varchar(50) [not null, unique, note: '서버 자동 생성']
  title varchar(150) [not null]
  description text
  color_key varchar(20) [not null, default: 'green', note: 'green/orange/blue/violet']
  is_archived boolean [not null, default: false]
  revision int [not null, default: 1]
  created_by bigint [not null]
  created_at timestamp [not null, default: `now()`]
  updated_at timestamp [not null, default: `now()`]

  Note: 'API의 phase/displayPeriod는 로그인 사용자의 층에 맞는 course_sessions와 현재 날짜로 계산한다. leadProfessors/isMine/권한은 배정 테이블로 계산한다.'
}

Table course_sessions {
  id bigint [pk, increment]
  course_id bigint [not null]
  floor_number int [not null, note: '4 또는 5']
  start_date date [not null]
  end_date date [not null]
  created_at timestamp [not null, default: `now()`]
  updated_at timestamp [not null, default: `now()`]

  indexes {
    (course_id, floor_number) [unique]
  }

  Note: 'CHECK: floor_number IN (4,5), start_date <= end_date. 과목별 두 층 일정은 관리자 저장 트랜잭션에서 검증.'
}

Table course_instructor_assignments {
  id bigint [pk, increment]
  course_id bigint [not null]
  professor_id bigint [not null]
  class_number int [not null, note: '1~10']
  floor_number int [not null, note: 'class_number에 따라 4 또는 5']
  instructor_kind instructor_kind [not null]
  assigned_at timestamp [not null, default: `now()`]

  indexes {
    (course_id, class_number) [unique, note: '한 반에 교수님 한 분']
    (course_id, professor_id) [unique, note: '한 과목에서 교수님은 한 반만 담당']
    (course_id, floor_number, instructor_kind) [name: 'idx_course_assignment_floor_kind']
  }

  Note: '저장 시 10개 반/서로 다른 교수님 10명, 4층 LEAD 1+PRACTICE 4, 5층 LEAD 1+PRACTICE 4를 검증. 교수님 역할·활성 상태도 검증.'
}

Table questions {
  id bigint [pk, increment]
  course_id bigint [not null]
  author_id bigint [not null]
  related_post_id bigint
  title varchar(150) [not null]
  body text [not null]
  status question_status [not null, default: 'OPEN']
  resolved_at timestamp
  revision int [not null, default: 1]
  is_hidden boolean [not null, default: false]
  hidden_reason varchar(1000)
  hidden_by bigint
  hidden_at timestamp
  created_at timestamp [not null, default: `now()`]
  updated_at timestamp [not null, default: `now()`]

  indexes {
    (course_id, status, created_at) [name: 'idx_questions_course_status_created']
    (author_id, created_at) [name: 'idx_questions_author_created']
  }
}

Table question_tags {
  question_id bigint [not null]
  tag varchar(50) [not null]
  display_order int [not null]

  indexes {
    (question_id, display_order) [pk]
    (question_id, tag) [unique]
    (tag) [name: 'idx_question_tags_tag']
  }
}

Table answers {
  id bigint [pk, increment]
  question_id bigint [not null]
  author_id bigint [not null]
  author_role_at_creation user_role [not null, note: 'STUDENT 또는 PROFESSOR']
  body text [not null]
  revision int [not null, default: 1]
  is_hidden boolean [not null, default: false]
  hidden_reason varchar(1000)
  hidden_by bigint
  hidden_at timestamp
  created_at timestamp [not null, default: `now()`]
  updated_at timestamp [not null, default: `now()`]

  indexes {
    (question_id, author_role_at_creation, created_at) [name: 'idx_answers_question_role_created']
  }
}

Table posts {
  id bigint [pk, increment]
  course_id bigint [not null]
  author_id bigint [not null]
  author_instructor_kind instructor_kind [not null, note: '작성 당시 전임/실습 구분 보존']
  type post_type [not null]
  visibility_scope visibility_scope [not null]
  visibility_floor int
  visibility_class_number int
  title varchar(150) [not null]
  body text
  revision int [not null, default: 1]
  is_hidden boolean [not null, default: false]
  hidden_reason varchar(1000)
  hidden_by bigint
  hidden_at timestamp
  created_at timestamp [not null, default: `now()`]
  updated_at timestamp [not null, default: `now()`]

  indexes {
    (course_id, type, author_instructor_kind, updated_at) [name: 'idx_posts_course_type_priority']
    (visibility_scope, visibility_floor, visibility_class_number) [name: 'idx_posts_visibility']
  }

  Note: '공개 범위 CHECK: ALL은 대상 둘 다 null, FLOOR는 visibility_floor만 4/5, CLASS는 visibility_class_number만 1~10. MATERIAL은 material_versions 1개 이상, EXPLANATION은 버전 없음.'
}

Table material_versions {
  id bigint [pk, increment]
  post_id bigint [not null]
  version_number int [not null]
  change_note text [not null]
  created_by bigint [not null]
  created_at timestamp [not null, default: `now()`]

  indexes {
    (post_id, version_number) [unique]
    (post_id, created_at) [name: 'idx_material_versions_post_created']
  }
}

Table material_version_files {
  id bigint [pk, increment]
  material_version_id bigint [not null]
  original_file_name varchar(255) [not null]
  storage_key varchar(500) [not null, unique, note: '외부 스토리지 내부 키, 공개 응답 제외']
  file_size_bytes bigint [not null]
  mime_type varchar(150) [not null]
  checksum_sha256 char(64)
  display_order int [not null]
  created_at timestamp [not null, default: `now()`]

  indexes {
    (material_version_id, display_order) [unique]
  }
}

Table material_reads {
  user_id bigint [not null]
  post_id bigint [not null]
  last_seen_version_id bigint [not null]
  seen_at timestamp [not null]

  indexes {
    (user_id, post_id) [pk]
  }

  Note: '버전 확인 상태. last_seen_version_id는 반드시 같은 post_id의 버전이어야 하며 더 낮은 버전으로 역행시키지 않는다.'
}

Table post_user_states {
  user_id bigint [not null]
  post_id bigint [not null]
  read_at timestamp
  dismissed_at timestamp
  created_at timestamp [not null, default: `now()`]
  updated_at timestamp [not null, default: `now()`]

  indexes {
    (user_id, post_id) [pk]
    (user_id, dismissed_at, updated_at) [name: 'idx_post_user_states_notice']
  }

  Note: '학생 메인의 새 자료 블록에만 사용하는 개인 읽음/숨김 상태. material_reads의 버전 확인과 의미가 다르다.'
}

const corridors=new Map();function lane(side,t){const key=layout[t.name][0]+':'+side,n=corridors.get(key)||0;corridors.set(key,n+1);return side==='R'?t.x+TW+24+n*8:t.x-24-n*8}
function relation(r,i){const a=schema[r.from],b=schema[r.to],same=layout[r.from][0]===layout[r.to][0],right=layout[r.from][0]<layout[r.to][0],as=same?'R':right?'R':'L',bs=same?'R':right?'L':'R';const ax=a.x+(as==='R'?TW:0),bx=b.x+(bs==='R'?TW:0),ay=fy(a,r.field),by=fy(b,r.target),al=lane(as,a),bl=same?al:lane(bs,b);let points;if(same)points=`${ax},${ay} ${al},${ay} ${al},${by} ${bx},${by}`;else{const routeY=rowTop[Math.min(layout[r.from][1],layout[r.to][1])]-24-i*3.8;points=`${ax},${ay} ${al},${ay} ${al},${routeY} ${bl},${routeY} ${bl},${by} ${bx},${by}`}
const f=a.fields.find(f=>f.name===r.field),optional=!(f.nn||f.pk),color=a.group.color,ad=as==='R'?1:-1,bd=bs==='R'?1:-1;
let s=`<g class="edge" data-ref="${r.id}" data-from="${r.from}" data-to="${r.to}"><title>${r.id}: ${r.from}.${r.field} → ${r.to}.${r.target} | child 0..N : parent ${optional?'0..1':'1'}</title><polyline points="${points}" fill="none" stroke="transparent" stroke-width="15"/><polyline class="wire" points="${points}" fill="none" stroke="${color}" stroke-width="2.4" stroke-linejoin="round" ${optional?'stroke-dasharray="7 5"':''} opacity=".68"/><path d="M${ax} ${ay-7} L${ax+ad*13} ${ay} L${ax} ${ay+7}" fill="none" stroke="${color}" stroke-width="2"/><circle cx="${ax+ad*19}" cy="${ay}" r="4" fill="#fcfdfb" stroke="${color}" stroke-width="2"/><path d="M${bx+bd*8} ${by-7} V${by+7}" stroke="${color}" stroke-width="2"/>`;
s+=optional?`<circle cx="${bx+bd*19}" cy="${by}" r="4" fill="#fcfdfb" stroke="${color}" stroke-width="2"/>`:`<path d="M${bx+bd*16} ${by-7} V${by+7}" stroke="${color}" stroke-width="2"/>`;return s+'</g>'}
function render(){corridors.clear();let s=`<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" style="font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',sans-serif"><rect width="${W}" height="${H}" fill="#fcfdfb"/>`+text(LEFT,65,'SKALog / ENTITY RELATIONSHIP DIAGRAM',38,'#194631',700)+text(LEFT,103,'15 tables  ·  142 columns  ·  25 foreign keys  ·  6 enums  |  Original DBML names & constraints',21,'#738579')+text(LEFT,139,'PK primary key   ·   FK foreign key   ·   UQ unique   ·   AI increment   ·   NN not null   ·   dashed line = nullable FK   ·   crow’s foot = 0..N',18,'#6c7e70');groups.forEach((g,i)=>s+=text(LEFT+i*COL,197,g.label,21,g.color,700));

s+=text(LEFT,bottom,'ENUM DEFINITIONS',24,'#34523e',700);Object.entries(enums).forEach(([n,values],i)=>{const x=LEFT+(i%3)*COL,y=bottom+38+Math.floor(i/3)*94;s+=text(x,y,n,22,'#48624f',650)+text(x,y+30,values.join('  |  '),18,'#7a887c')});
s+=text(LEFT,bottom+259,'FOREIGN KEY REGISTER · child FK → parent key',24,'#34523e',700);refs.forEach((r,i)=>{const x=LEFT+Math.floor(i/9)*1290,y=bottom+299+(i%9)*29;s+=text(x,y,`${r.id}  ${r.from}.${r.field} → ${r.to}.${r.target}`,18,schema[r.from].group.color)});
s+=text(LEFT,H-31,'SOURCE: SKALA교육플랫폼-DB.dbml · Notes are documentation, not declared CHECK constraints. Column notes: hover / double-click table.',17,'#7a887c')+'</svg>';document.querySelector('#stage').innerHTML=s}
render();
const viewport=document.querySelector('#viewport');let zoom=1;
function setZoom(z,cx,cy){const old=zoom;zoom=Math.min(2,Math.max(.12,z));const svg=document.querySelector('#stage svg');svg.style.width=W*zoom+'px';svg.style.height=H*zoom+'px';document.querySelector('#zoomLabel').textContent=Math.round(zoom*100)+'%';if(cx!==undefined){viewport.scrollLeft=(viewport.scrollLeft+cx)*zoom/old-cx;viewport.scrollTop=(viewport.scrollTop+cy)*zoom/old-cy}}
function fit(){setZoom(Math.min((viewport.clientWidth-48)/W,(viewport.clientHeight-48)/H));viewport.scrollLeft=0;viewport.scrollTop=0}
document.querySelector('#fit').onclick=fit;document.querySelector('#readable').onclick=()=>setZoom(1);document.querySelector('#minus').onclick=()=>setZoom(zoom/1.2);document.querySelector('#plus').onclick=()=>setZoom(zoom*1.2);
viewport.addEventListener('wheel',e=>{if(e.ctrlKey||e.metaKey){e.preventDefault();const b=viewport.getBoundingClientRect();setZoom(zoom*(e.deltaY<0?1.12:1/1.12),e.clientX-b.left,e.clientY-b.top)}},{passive:false});let drag=null,moved=false;
viewport.addEventListener('pointerdown',e=>{if(e.button!==0)return;drag={x:e.clientX,y:e.clientY,l:viewport.scrollLeft,t:viewport.scrollTop};moved=false});window.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.abs(dx)+Math.abs(dy)>5){moved=true;viewport.scrollLeft=drag.l-dx;viewport.scrollTop=drag.t-dy}});window.addEventListener('pointerup',()=>{drag=null});
function highlight(n,id){const related=new Set(n?[n]:[]);refs.filter(r=>id?r.id===id:r.from===n||r.to===n).forEach(r=>{related.add(r.from);related.add(r.to)});document.querySelectorAll('.edge').forEach(e=>{const active=id?e.dataset.ref===id:e.dataset.from===n||e.dataset.to===n;e.classList.toggle('muted',!!(n||id)&&!active);e.classList.toggle('selected',!!(n||id)&&active)});document.querySelectorAll('.entity').forEach(e=>{e.classList.toggle('muted',!!(n||id)&&!related.has(e.dataset.table));e.classList.toggle('selected',e.dataset.table===n)});document.querySelector('#status').textContent=id?refs.filter(r=>r.id===id).map(r=>`${r.id}: ${r.from}.${r.field} → ${r.to}.${r.target}`).join(''):n||''}
document.querySelectorAll('.entity').forEach(e=>{e.onclick=()=>{if(!moved)highlight(e.dataset.table)};e.ondblclick=()=>show(e.dataset.table);e.onkeydown=k=>{if(k.key==='Enter')highlight(e.dataset.table)}});document.querySelectorAll('.edge').forEach(e=>e.onclick=()=>{if(!moved)highlight(null,e.dataset.ref)});document.querySelector('#reset').onclick=()=>{highlight();document.querySelector('#search').value=''};
document.querySelector('#search').oninput=e=>{const q=e.target.value.trim().toLowerCase();if(!q){highlight();return}const t=Object.values(schema).find(t=>t.name.includes(q)||t.fields.some(f=>f.name.includes(q)));if(t){highlight(t.name);setZoom(.8);viewport.scrollLeft=t.x*zoom-40;viewport.scrollTop=t.y*zoom-40}};
function show(n){document.querySelector('#modalBody').innerHTML='<h2>'+esc(n||'Original DBML')+'</h2><pre>'+esc(n?schema[n].raw+'\n'+refs.filter(r=>r.from===n||r.to===n).map(r=>`${r.id}: ${r.from}.${r.field} > ${r.to}.${r.target}`).join('\n'):raw)+'</pre>';document.querySelector('#modal').showModal()}
document.querySelector('#source').onclick=()=>show();document.querySelector('#close').onclick=()=>document.querySelector('#modal').close();
function download(blob,name){const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),3000)}
function svgBlob(){const clone=document.querySelector('#stage svg').cloneNode(true);clone.style.width='';clone.style.height='';clone.querySelectorAll('.muted,.selected').forEach(e=>e.classList.remove('muted','selected'));return new Blob([new XMLSerializer().serializeToString(clone)],{type:'image/svg+xml;charset=utf-8'})}
document.querySelector('#svgSave').onclick=()=>download(svgBlob(),'SKALog-ERD-complete.svg');
async function png(crop){const button=document.querySelector(crop?'#cropSave':'#pngSave'),label=button.textContent;button.disabled=true;button.textContent='이미지 생성 중…';let u;try{await document.fonts.ready;u=URL.createObjectURL(svgBlob());const im=new Image;await new Promise((resolve,reject)=>{im.onload=resolve;im.onerror=reject;im.src=u});const c=document.createElement('canvas');if(crop){const sx=Math.max(0,(viewport.scrollLeft-24)/zoom),sy=Math.max(0,(viewport.scrollTop-24)/zoom),sw=Math.min(W-sx,viewport.clientWidth/zoom),sh=Math.min(H-sy,viewport.clientHeight/zoom);c.width=Math.round(sw*1.5);c.height=Math.round(sh*1.5);c.getContext('2d').drawImage(im,sx,sy,sw,sh,0,0,c.width,c.height)}else{c.width=W*1.5;c.height=Math.round(H*1.5);c.getContext('2d').drawImage(im,0,0,c.width,c.height)}const blob=await new Promise(r=>c.toBlob(r,'image/png'));if(!blob)throw Error('PNG failed');download(blob,crop?'SKALog-ERD-viewport.png':'SKALog-ERD-complete.png')}catch(e){alert('PNG 생성 실패: SVG 저장을 이용해주세요.')}finally{if(u)URL.revokeObjectURL(u);button.disabled=false;button.textContent=label}}
