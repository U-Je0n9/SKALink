rder-radius:0;box-shadow:none}.present{background:#f8faf8}.present #exit{display:block}#exit{display:none;position:fixed;right:14px;top:12px;opacity:.25}#exit:hover{opacity:1}@media print{header,.hint,#exit{display:none!important}main{padding:0}#stage{box-shadow:none}body{background:#f8faf8}@page{size:landscape;margin:0}}

<script>
'use strict';
const raw=document.querySelector('#dbml').textContent;
const schema={},refs=[];let current=null,depth=0;
for(const line of raw.split('\n')){const start=line.match(/^Table (\w+) \{/);if(start){current={name:start[1],fields:[],raw:line+'\n'};schema[current.name]=current;depth=1;continue}if(current){current.raw+=line+'\n';const f=line.match(/^  (\w+) ([\w]+(?:\(\d+\))?)(?: \[(.*)\])?\s*$/);if(depth===1&&f)current.fields.push({name:f[1],type:f[2],flags:f[3]||'',pk:/\bpk\b/.test(f[3]||'')});if(depth===2&&/\[pk\]/.test(line)){const cols=line.match(/\(([^)]+)\)/)[1].split(',').map(x=>x.trim());current.fields.forEach(f=>{if(cols.includes(f.name))f.pk=true})}depth+=(line.match(/\{/g)||[]).length-(line.match(/\}/g)||[]).length;if(depth===0)current=null}const r=line.match(/^Ref: (\w+)\.(\w+) > (\w+)\.(\w+)/);if(r)refs.push({from:r[1],field:r[2],to:r[3],target:r[4]})}
const enums=raw.slice(raw.indexOf('Enum '),raw.indexOf('Table ')).trim();
const groups=[
{title:'회원 · 인증',en:'IDENTITY',color:'#0f5b45',soft:'#e6f0e9',tables:['users','auth_sessions','registration_directory','email_verifications'],desc:'가입 기준부터 로그인 세션까지'},
{title:'과목 · 운영',en:'COURSE',color:'#bd642d',soft:'#fbede1',tables:['courses','course_sessions','course_instructor_assignments'],desc:'과목별 일정과 교수 배정'},
{title:'질문 · 답변',en:'KNOWLEDGE',color:'#5366a8',soft:'#eceffa',tables:['questions','answers','question_tags'],desc:'수업의 질문을 지식으로 축적'},
{title:'게시물 · 학습 자료',en:'CONTENT',color:'#795ca0',soft:'#f0eaf7',tables:['posts','material_versions','material_version_files','material_reads','post_user_states'],desc:'자료 배포, 버전 관리, 개인별 확인'}];
const names={users:'사용자',auth_sessions:'로그인 세션',registration_directory:'가입 기준 명단',email_verifications:'이메일 인증',courses:'과목',course_sessions:'층별 운영 일정',course_instructor_assignments:'교수 배정',questions:'질문',answers:'답변',question_tags:'질문 태그',posts:'게시물',material_versions:'자료 버전',material_version_files:'버전별 파일',material_reads:'자료 버전 확인',post_user_states:'개인별 읽음 · 숨김'};
const core={users:['id','role','status','class_number'],auth_sessions:['id','user_id','expires_at'],registration_directory:['identity_no','role','email'],email_verifications:['id','email','expires_at'],courses:['id','title','created_by'],course_sessions:['id','course_id','floor_number'],course_instructor_assignments:['id','course_id','professor_id'],questions:['id','course_id','author_id','status'],answers:['id','question_id','author_id'],question_tags:['question_id','display_order','tag'],posts:['id','course_id','type','visibility_scope'],material_versions:['id','post_id','version_number'],material_version_files:['id','material_version_id','original_file_name'],material_reads:['user_id','post_id','last_seen_version_id'],post_user_states:['user_id','post_id','read_at']};
const esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const txt=(x,y,s,size=16,color='#243e31',weight=400,extra='')=>`<text x="${x}" y="${y}" fill="${color}" font-size="${size}" font-weight="${weight}" ${extra}>${esc(s)}</text>`;
const rect=(x,y,w,h,fill,stroke='none',r=12)=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${r}" fill="${fill}" stroke="${stroke}"/>`;
let view=0;
function card(name,x,y,w,overview,g){const t=schema[name],fields=overview?core[name].map(n=>t.fields.find(f=>f.name===n)):t.fields;const row=overview?21:25,h=overview?118:85+fields.length*row;let s=`<g class="entity" data-table="${name}" tabindex="0" role="button" aria-label="${names[name]} 전체 스키마 보기"><rect class="card" x="${x}" y="${y}" width="${w}" height="${h}" rx="11" fill="#fff" stroke="#d7e2da"/>`;
s+=rect(x+1,y+1,5,h-2,g.color,'none',2)+txt(x+18,y+28,names[name],overview?21:24,g.color,700)+txt(x+18,y+49,name,name.length>27?13:15,'#6c7e72',500);
if(overview){const pk=fields.filter(f=>f.pk).map(f=>f.name).join(' + ');s+=txt(x+18,y+76,'PK  '+pk,14,'#354f40',600);const rest=fields.filter(f=>!f.pk).map(f=>f.name).join(' · ');s+=txt(x+18,y+99,rest,rest.length>40?11.5:14,'#6c7e72');}
else{fields.forEach((f,i)=>{const fy=y+79+i*row;const fk=refs.find(r=>r.from===name&&r.field===f.name);s+=txt(x+16,fy,(f.pk?'PK':'')+(f.pk&&fk?'/':'')+(fk?'FK':''),10,f.pk?g.color:'#839087',700)+txt(x+53,fy,f.name,w<310?12.5:14,'#274534',f.pk?600:400)+txt(x+w-12,fy,f.type,w<310?10:11,'#829087',400,'text-anchor="end"');if(/not null/.test(f.flags)||f.pk)s+=`<circle cx="${x+w-5}" cy="${fy-4}" r="2" fill="${g.color}"/>`;})}return s+'</g>'}
function render(){document.querySelector('nav').innerHTML=['전체 구조',...groups.map(g=>g.title)].map((n,i)=>`<button class="${view===i?'active':''}" data-view="${i}">${n}</button>`).join('');let s=`<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" style="font-family:Pretendard,'Apple SD Gothic Neo','Malgun Gothic',sans-serif"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#93a699" stroke-width="1.5"/></marker></defs>`+rect(0,0,1600,900,'#f8faf8','none',0)+txt(48,40,'SKALog  /  DATA ARCHITECTURE',14,'#0f5b45',700)+txt(48,91,view?groups[view-1].title+' 데이터 모델':'배움의 흐름을 연결하는 데이터 구조',36,'#183d2c',700)+txt(48,124,view?groups[view-1].desc+' · 전체 컬럼 표시':'사용자를 중심으로 과목, 질문과 답변, 학습 자료를 연결합니다.',18,'#738579')+txt(1552,44,`${String(view+1).padStart(2,'0')} / 05`,14,'#718377',600,'text-anchor="end"');
if(!view){groups.forEach((g,gi)=>{const x=48+gi*388;s+=rect(x,158,340,38,g.soft)+txt(x+15,183,`${String(gi+1).padStart(2,'0')}   ${g.title}`,18,g.color,700);g.tables.forEach((n,i)=>s+=card(n,x,212+i*126,340,true,g));});
// Core parent-to-child relationships; shared audit and cross-domain FKs remain in table details.
const edges=[['users','auth_sessions'],['courses','course_sessions'],['courses','course_instructor_assignments'],['questions','answers'],['questions','question_tags'],['posts','material_versions'],['material_versions','material_version_files'],['posts','material_reads'],['posts','post_user_states']];
for(const [a,b]of edges){let gi=groups.findIndex(g=>g.tables.includes(a)),g=groups[gi],ai=g.tables.indexOf(a),bi=g.tables.indexOf(b),x=48+gi*388+340,y1=212+ai*126+62,y2=212+bi*126+62,lane=x+12+(bi-ai)*5;s+=`<path d="M${x} ${y1} H${lane} V${y2} H${x+2}" fill="none" stroke="#a8b9ae" stroke-width="1.4" marker-end="url(#arrow)"/>`+txt(lane+3,y2-5,'N',10,'#7b8d81');}
s+=txt(48,769,'가입 기준 명단 · 이메일 인증',15,'#6e8375',600)+txt(48,792,'두 테이블에는 선언된 FK가 없습니다.',14,'#7c8d81');
s+=txt(436,643,'과목을 중심으로 연결',18,'#bd642d',700)+txt(436,674,'courses.id → questions.course_id',14,'#6a7d70')+txt(436,701,'courses.id → posts.course_id',14,'#6a7d70')+txt(436,739,'작성자 · 담당자 → users.id',15,'#0f5b45',600)+txt(436,765,'각 도메인의 사용자 FK로 연결됩니다.',14,'#7c8d81');
s+=txt(824,643,'질문에서 자료로 연결',18,'#5366a8',700)+txt(824,674,'questions.related_post_id → posts.id',14,'#6a7d70')+txt(824,706,'관련 게시물 연결은 선택 사항입니다.',14,'#7c8d81')+txt(824,748,'1 → N  주요 내부 FK 관계',14,'#6a7d70')+txt(824,774,'PK와 핵심 컬럼만 표시한 요약도',14,'#7c8d81');
}else{const g=groups[view-1],gap=18,w=(1504-gap*(g.tables.length-1))/g.tables.length;g.tables.forEach((n,i)=>s+=card(n,48+i*(w+gap),201,w,false,g));const local=refs.filter(r=>g.tables.includes(r.from));let y=765;s+=txt(48,y,'관계 읽기   자식 테이블의 FK → 부모 테이블의 PK',15,g.color,700);s+=txt(48,y+27,`${g.tables.length}개 테이블 · ${local.length}개 FK · PK = 기본키 / FK = 외래키 / ● = NOT NULL`,14,'#718477');s+=txt(48,y+54,'테이블을 선택하면 관계의 양 끝, UNIQUE · 복합키 · CHECK 관련 원문을 볼 수 있습니다.',14,'#718477');}
s+=`<path d="M48 852 H1552" stroke="#dce5de"/>`+txt(48,878,'SOURCE  SKALA교육플랫폼-DB.dbml    ·    15 TABLES / 25 FOREIGN KEYS',12,'#7b8c80',500)+txt(1552,878,view?'SCHEMA DETAIL  ·  모든 컬럼 / 모든 관계는 테이블 상세에서 확인':'OVERVIEW  ·  관계선은 주요 내부 FK만 표시',12,'#7b8c80',500,'text-anchor="end"')+'</svg>';document.querySelector('#stage').innerHTML=s;document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{view=+b.dataset.view;render()});document.querySelectorAll('[data-table]').forEach(b=>{b.onclick=()=>show(b.dataset.table);b.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();show(b.dataset.table)}}});}
function show(n){const t=schema[n],rs=refs.filter(r=>r.from===n||r.to===n);document.querySelector('#detailBody').innerHTML=`<p>TABLE DETAILS / ${t.fields.length} COLUMNS</p><h2>${names[n]}</h2><p>${n}</p><table><thead><tr><th>키</th><th>컬럼</th><th>타입</th><th>NULL</th></tr></thead><tbody>${t.fields.map(f=>`<tr><td>${f.pk?'PK ':''}${refs.some(r=>r.from===n&&r.field===f.name)?'FK':''}</td><td>${f.name}</td><td><code>${f.type}</code></td><td>${f.pk||/not null/.test(f.flags)?'불가':'허용'}</td></tr>`).join('')}</tbody></table><h3>연결 관계 · ${rs.length}</h3><p>아래 화살표는 자식 FK → 부모 키입니다. 부모 한 행에 자식 0..N행이 연결됩니다. FK의 NULL 허용 여부는 위 표에서 확인하세요.</p>${rs.map(r=>`<div class="rel">${r.from}.${r.field} → ${r.to}.${r.target}</div>`).join('')||'<p>DBML에 선언된 외래키 관계가 없습니다.</p>'}<details><summary>제약조건 · 인덱스 · 설명 원문</summary><pre>${esc(t.raw)}</pre></details><details><summary>Enum 정의</summary><pre>${esc(enums)}</pre></details>`;document.querySelector('#detail').showModal()}
const originalRender=render;
const pages=[
 {id:'overview',title:'구조 요약'},
 {id:'complete',title:'전체 ERD'},
 {id:'identity-a',title:'회원 · 세션',group:0,tables:['users','auth_sessions']},
 {id:'identity-b',title:'가입 · 인증',group:0,tables:['registration_directory','email_verifications']},
 {id:'course',title:'과목 · 운영',group:1,tables:groups[1].tables},
 {id:'knowledge',title:'질문 · 답변',group:2,tables:groups[2].tables},
 {id:'content-a',title:'게시물 · 버전',group:3,tables:['posts','material_versions']},
 {id:'content-b',title:'파일 · 확인 상태',group:3,tables:['material_version_files','material_reads','post_user_states']},
 {id:'enums',title:'Enum · 관계 목록'}
];
function fieldY(t,f,y){return y+107+schema[t].fields.findIndex(a=>a.name===f)*28}
function fullCard(n,x,y,w,g){const t=schema[n],h=125+t.fields.length*28;let s=`<g class="entity" data-table="${n}" tabindex="0" role="button" aria-label="${esc(n)} 상세"><rect class="card" x="${x}" y="${y}" width="${w}" height="${h}" rx="12" fill="#fff" stroke="#d2ded6"/>`;
s+=rect(x,y,w,7,g.color,'none',3)+txt(x+20,y+38,names[n],25,g.color,700)+txt(x+20,y+65,n,17,'#5b7164',500)+txt(x+w-20,y+38,t.fields.length+' 컬럼',13,'#6c7e72',500,'text-anchor="end"');
s+=`<path d="M${x+16} ${y+80} H${x+w-16}" stroke="#e0e8e2"/>`;
t.fields.forEach((f,i)=>{const fy=fieldY(n,f.name,y),fk=refs.some(r=>r.from===n&&r.field===f.name),key=[f.pk?'PK':'',fk?'FK':'',/\bunique\b/.test(f.flags)?'UQ':''].filter(Boolean).join('/');
if(i%2===0)s+=rect(x+8,fy-19,w-16,27,'#f5f8f5','none',3);
s+=txt(x+15,fy,key,10,g.color,700)+txt(x+77,fy,f.name,16,'#263f31',f.pk?700:400)+txt(x+w-35,fy,f.type,13,'#60756a',400,'text-anchor="end"')+txt(x+w-14,fy,f.pk||/not null/.test(f.flags)?'●':'○',11,g.color,400,'text-anchor="end"');});
return s+'</g>'}
function frame(w,h,title,subtitle){return `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" style="font-family:'Apple SD Gothic Neo','Malgun Gothic',sans-serif"><defs><marker id="fkArrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#7b8e82" stroke-width="1.5"/></marker></defs>`+rect(0,0,w,h,'#f8faf8','none',0)+txt(48,40,'SKALog / DATA ARCHITECTURE',14,'#0f5b45',700)+txt(48,88,title,34,'#183d2c',700)+txt(48,121,subtitle,16,'#6a8071')}
render=function(){const p=pages[view];let s='';
if(view===0){originalRender();s=document.querySelector('#stage').innerHTML.replace('01 / 05','01 / 09');}
else if(view===1){const w=2660,h=2620; s=frame(w,h,'전체 데이터 관계도','15 TABLES · 142 COLUMNS · 25 FOREIGN KEYS · FK → 참조 키 / 모든 컬럼 표시');const positions={};groups.forEach((g,gi)=>{const x=48+gi*660;let y=190;s+=txt(x,165,g.title,23,g.color,700);for(const n of g.tables){positions[n]={x,y,w:550};y+=125+schema[n].fields.length*28+38;}});
// Every declared foreign key has its own numbered path and an exact endpoint register.
refs.forEach((r,i)=>{const a=positions[r.from],b=positions[r.to],ay=fieldY(r.from,r.field,a.y)-5,by=fieldY(r.to,r.target,b.y)-5,laneA=a.x+a.w+14+(i%8)*8,laneB=b.x+b.w+14+(i%8)*8,top=182+(i%7);
const d=a.x===b.x?`M${a.x+a.w} ${ay} H${laneA} V${by} H${b.x+b.w}`:`M${a.x+a.w} ${ay} H${laneA} V${top} H${laneB} V${by} H${b.x+b.w}`;
s+=`<path data-ref="${i+1}" d="${d}" fill="none" stroke="${groups.find(g=>g.tables.includes(r.from)).color}" stroke-opacity=".42" stroke-width="1.5" marker-end="url(#fkArrow)"/>`;
s+=rect(a.x+a.w-3,ay-9,22,17,'#e7eee9','none',4)+txt(a.x+a.w+8,ay+3,String(i+1).padStart(2,'0'),10,'#375a44',700,'text-anchor="middle"');});
for(const g of groups)for(const n of g.tables){const a=positions[n];s+=fullCard(n,a.x,a.y,a.w,g)}
s+=txt(48,2200,'FOREIGN KEY REGISTER / 25개 관계 · 선 번호와 대응',23,'#183d2c',700);
refs.forEach((r,i)=>{const col=i<13?0:1,yy=2242+(i%13)*26;s+=txt(48+col*1300,yy,`${String(i+1).padStart(2,'0')}  ${r.from}.${r.field} → ${r.to}.${r.target}`,17,'#486251')});s+='</svg>';
}else if(view===8){s=frame(1600,900,'Enum 정의와 전체 관계','6 ENUMS · 25 FOREIGN KEYS / 자식 FK → 부모 참조 키');const blocks=[...enums.matchAll(/Enum (\w+) \{([\s\S]*?)\}/g)];blocks.forEach((m,i)=>{const x=48,y=166+i*104;s+=rect(x,y,390,91,'#eaf1ec')+txt(x+16,y+29,m[1],19,'#0f5b45',700)+txt(x+16,y+60,m[2].trim().split(/\s+/).join(' · '),15,'#506c59')});refs.forEach((r,i)=>s+=txt(470,178+i*25,`${String(i+1).padStart(2,'0')}  ${r.from}.${r.field} → ${r.to}.${r.target}`,16,'#3d5b48'));s+='</svg>';
}else{const g=groups[p.group],w=(1504-24*(p.tables.length-1))/p.tables.length;s=frame(1600,900,p.title+' 데이터 모델','전체 컬럼 · 데이터 타입 · PK / FK / UQ · ● NOT NULL / ○ NULL 허용');p.tables.forEach((n,i)=>s+=fullCard(n,48+i*(w+24),155,w,g));const rs=refs.filter(r=>p.tables.includes(r.from));s+=txt(48,815,`${p.tables.length}개 테이블 · ${p.tables.reduce((a,n)=>a+schema[n].fields.length,0)}개 컬럼 · ${rs.length}개 외래키`,16,g.color,700)+txt(48,845,'관계의 양 끝은 전체 ERD / Enum · 관계 목록에서 확인 · 테이블 클릭 시 기본값, 설명, 인덱스, CHECK 원문 표시',14,'#718477')+txt(1552,877,`${String(view+1).padStart(2,'0')} / 09`,13,'#718477',600,'text-anchor="end"')+'</svg>';}
document.querySelector('#stage').innerHTML=s;document.querySelector('nav').innerHTML=pages.map((p,i)=>`<button class="${view===i?'active':''}" data-view="${i}">${p.title}</button>`).join('');document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{view=+b.dataset.view;render()});document.querySelectorAll('[data-table]').forEach(b=>{b.onclick=()=>show(b.dataset.table);b.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();show(b.dataset.table)}}});};
document.querySelector('.close').onclick=()=>document.querySelector('#detail').close();
document.querySelector('#source').onclick=()=>{document.querySelector('#detailBody').innerHTML='<h2>원본 DBML · 전체 스키마</h2><p>테이블·속성·기본값·설명·인덱스·Enum·관계를 원문 그대로 포함합니다.</p><pre>'+esc(raw)+'</pre>';document.querySelector('#detail').showModal()};
document.querySelector('#fit').onclick=()=>document.querySelector('#stage svg').style.width='100%';
document.querySelector('#actual').onclick=()=>{const svg=document.querySelector('#stage svg');svg.style.width=svg.getAttribute('width')+'px'};
function presentation(on){document.body.classList.toggle('present',on)}document.querySelector('#present').onclick=()=>presentation(true);document.querySelector('#exit').onclick=()=>presentation(false);document.addEventListener('keydown',e=>{if(document.querySelector('dialog').open)return;if(e.key==='Escape')presentation(false);if(['ArrowLeft','ArrowRight'].includes(e.key)){e.preventDefault();view=(view+(e.key==='ArrowRight'?1:pages.length-1))%pages.length;render()}});
function save(blob,ext){const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`SKALog-ERD-${pages[view].id}.${ext}`;a.click();setTimeout(()=>URL.revokeObjectURL(url),2000)}
function svgBlob(){const svg=document.querySelector('#stage svg').cloneNode(true);svg.style.width='';return new Blob([new XMLSerializer().serializeToString(svg)],{type:'image/svg+xml;charset=utf-8'})}
document.querySelector('#svgExport').onclick=()=>save(svgBlob(),'svg');document.querySelector('#pngExport').onclick=async()=>{const b=document.querySelector('#pngExport');b.disabled=true;b.textContent='저장 중…';try{await document.fonts.ready;const url=URL.createObjectURL(svgBlob()),im=new Image;try{await new Promise((resolve,reject)=>{im.onload=resolve;im.onerror=reject;im.src=url});const c=document.createElement('canvas');c.width=im.naturalWidth*2;c.height=im.naturalHeight*2;c.getContext('2d').drawImage(im,0,0,c.width,c.height);const blob=await new Promise(r=>c.toBlob(r,'image/png'));if(!blob)throw Error('PNG 생성 실패');save(blob,'png')}finally{URL.revokeObjectURL(url)}}catch(e){alert('PNG 저장에 실패했습니다. SVG 저장을 이용해주세요.')}finally{b.disabled=false;b.textContent='PNG 저장 · 2×'}};
view=1;render();
</script></html>
